name: Publish C16 Browser v0.2 APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'c16-release-v02/**'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download successful v0.2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33911323061 --repo jiyaoxiong/homeDemo --name C16Browser-Alpha-v0.2-APK
          ls -lh C16Browser-Alpha-v0.2.apk
          sha256sum C16Browser-Alpha-v0.2.apk

      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete c16-browser-alpha-v0.2-compat --repo jiyaoxiong/homeDemo --cleanup-tag -y || true
          gh release create c16-browser-alpha-v0.2-compat \
            C16Browser-Alpha-v0.2.apk \
            C16Browser-Alpha-v0.2.apk.sha256 \
            C16_BUILD_INFO.txt \
            --repo jiyaoxiong/homeDemo \
            --title 'C16 Browser Alpha v0.2 Compat' \
            --notes 'Full Chromium Android ARM64 compatibility build for C16. No WebView. Fixed Chromium snapshot 1676249, C16 landscape branding.'
