name: Build C16 Chromium Browser Alpha

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'c16/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest full Chromium Android Desktop ARM64 APK
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, urllib.request
          api='https://api.github.com/repos/andrewginns/chromium-browser-snapshots-AndroidDesktop_arm64/releases/latest'
          req=urllib.request.Request(api, headers={'User-Agent':'C16-Browser-Builder'})
          with urllib.request.urlopen(req, timeout=60) as r:
              data=json.load(r)
          apk=next((a for a in data.get('assets', []) if a.get('name')=='ChromePublic.apk'), None)
          if not apk:
              raise SystemExit('ChromePublic.apk not found in latest release')
          print('release:', data.get('tag_name'))
          print('url:', apk['browser_download_url'])
          urllib.request.urlretrieve(apk['browser_download_url'], 'ChromePublic.apk')
          open('CHROMIUM_SNAPSHOT.txt','w').write(str(data.get('tag_name'))+'\n')
          PY
          ls -lh ChromePublic.apk
          sha256sum ChromePublic.apk

      - name: Download Apktool
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, urllib.request
          api='https://api.github.com/repos/iBotPeaches/Apktool/releases/latest'
          req=urllib.request.Request(api, headers={'User-Agent':'C16-Browser-Builder'})
          with urllib.request.urlopen(req, timeout=60) as r:
              data=json.load(r)
          jar=next((a for a in data.get('assets', []) if a.get('name','').endswith('.jar') and 'apktool' in a.get('name','').lower()), None)
          if not jar:
              raise SystemExit('Apktool jar not found')
          print('apktool:', jar.get('name'))
          urllib.request.urlretrieve(jar['browser_download_url'], 'apktool.jar')
          PY
          java -jar apktool.jar --version

      - name: Decode resources, preserve Chromium DEX and native libraries
        shell: bash
        run: |
          set -euxo pipefail
          java -Xmx5g -jar apktool.jar d -f -s ChromePublic.apk -o c16-decoded
          du -sh c16-decoded

      - name: Apply C16 car-display UI patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root=Path('c16-decoded')
          manifest=root/'AndroidManifest.xml'
          ANDROID='http://schemas.android.com/apk/res/android'
          A='{%s}' % ANDROID
          ET.register_namespace('android', ANDROID)

          tree=ET.parse(manifest)
          mr=tree.getroot()

          # Chrome 155 Android Desktop snapshots contain preview-framework manifest attributes
          # that Apktool's stable framework cannot link. They are optimization/native-service
          # hints; remove them in this compatibility Alpha so the ordinary Chromium sandboxed
          # process services remain available on current production Android builds.
          stripped=[]
          for elem in mr.iter():
              for attr in ('zygotePreloadNativeLib','zygotePreloadNativeFunc','nativeService'):
                  key=A+attr
                  if key in elem.attrib:
                      stripped.append((elem.tag, attr, elem.attrib.get(key)))
                      elem.attrib.pop(key, None)
          print('preview framework attrs stripped:', len(stripped))
          for item in stripped: print('STRIP', *item)

          # Brand app and force the real browser launcher activity to landscape.
          app=mr.find('application')
          if app is not None:
              app.set(A+'label','C16 Browser')
              app.set(A+'resizeableActivity','true')

          activities=list(mr.findall('./application/activity'))
          aliases=list(mr.findall('./application/activity-alias'))
          launcher_count=0
          for node in activities+aliases:
              is_launcher=False
              for filt in node.findall('intent-filter'):
                  actions={x.get(A+'name') for x in filt.findall('action')}
                  cats={x.get(A+'name') for x in filt.findall('category')}
                  if 'android.intent.action.MAIN' in actions and 'android.intent.category.LAUNCHER' in cats:
                      is_launcher=True
              if not is_launcher:
                  continue
              launcher_count += 1
              node.set(A+'label','C16 Browser')
              if node.tag == 'activity':
                  node.set(A+'screenOrientation','landscape')
                  node.set(A+'resizeableActivity','true')
              else:
                  target=node.get(A+'targetActivity')
                  for act in activities:
                      if target and act.get(A+'name') == target:
                          act.set(A+'screenOrientation','landscape')
                          act.set(A+'resizeableActivity','true')
          tree.write(manifest,encoding='utf-8',xml_declaration=True)
          print('launcher nodes patched:',launcher_count)

          brand_names={'app_name','application_name','product_name','chrome_app_name','chrome_name','application_label','app_label','browser_app_name'}
          brand_count=0
          for p in root.glob('res/values*/strings.xml'):
              try:
                  t=ET.parse(p); rr=t.getroot(); changed=False
                  for el in rr.findall('string'):
                      n=el.get('name','')
                      text=''.join(el.itertext()).strip()
                      if n in brand_names or text == 'Chromium':
                          el.text='C16 Browser'; changed=True; brand_count += 1
                  if changed:
                      t.write(p,encoding='utf-8',xml_declaration=True)
              except Exception as e:
                  print('skip string file',p,e)
          print('branding strings patched:',brand_count)

          overrides={
              'toolbar_height':'64dp','toolbar_height_tablet':'64dp','toolbar_height_no_shadow':'64dp',
              'tab_strip_height':'52dp','tabstrip_height':'52dp','tab_height':'52dp','tab_strip_toolbar_height':'52dp',
              'toolbar_button_width':'58dp','toolbar_button_height':'58dp','toolbar_button_size':'58dp',
              'new_tab_button_width':'60dp','new_tab_button_height':'60dp','new_tab_button_size':'60dp',
              'location_bar_text_size':'19sp','omnibox_text_size':'19sp','url_bar_text_size':'19sp',
              'tab_title_text_size':'18sp','tab_text_size':'18sp','tab_strip_text_size':'18sp',
              'omnibox_suggestion_height':'58dp','omnibox_suggestion_row_height':'58dp'
          }
          patched=[]
          candidates=[]
          for p in root.glob('res/values*/dimens.xml'):
              try:
                  t=ET.parse(p); rr=t.getroot(); changed=False
                  for el in rr.findall('dimen'):
                      name=el.get('name','')
                      if any(k in name for k in ('toolbar','tab_strip','tabstrip','omnibox','location_bar','url_bar')):
                          candidates.append((name,el.text,str(p)))
                      if name in overrides:
                          old=el.text; el.text=overrides[name]; changed=True
                          patched.append((name,old,el.text,str(p)))
                  if changed:
                      t.write(p,encoding='utf-8',xml_declaration=True)
              except Exception as e:
                  print('skip dimen file',p,e)
          print('dimensions patched:',len(patched))
          for item in patched[:150]: print('DIM',*item)
          print('candidate dimensions:',len(candidates))
          for item in candidates[:300]: print('CAND',*item)

          Path('C16_BUILD_INFO.txt').write_text(
              'C16 Browser Alpha\nFull Chromium Android Desktop ARM64 base\nNo Android WebView wrapper\nLandscape C16 car-display patch\nChromium 155 preview-manifest compatibility patch\n',encoding='utf-8')
          PY

      - name: Rebuild Chromium APK
        shell: bash
        run: |
          set -euxo pipefail
          java -Xmx5g -jar apktool.jar b c16-decoded -o C16Browser-unsigned.apk
          ls -lh C16Browser-unsigned.apk

      - name: Align and sign C16 Browser APK
        shell: bash
        run: |
          set -euxo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          keytool -genkeypair -v -keystore c16-release.jks -storepass c16browser -keypass c16browser -alias c16 -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=C16 Browser, OU=Car Browser, O=C16, L=Kunming, ST=Yunnan, C=CN'
          "$BUILD_TOOLS/zipalign" -f -p 4 C16Browser-unsigned.apk C16Browser-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks c16-release.jks --ks-key-alias c16 --ks-pass pass:c16browser --key-pass pass:c16browser --out C16Browser-Alpha.apk C16Browser-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs C16Browser-Alpha.apk
          sha256sum C16Browser-Alpha.apk | tee C16Browser-Alpha.apk.sha256
          ls -lh C16Browser-Alpha.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: C16Browser-Alpha-APK
          path: |
            C16Browser-Alpha.apk
            C16Browser-Alpha.apk.sha256
            CHROMIUM_SNAPSHOT.txt
            C16_BUILD_INFO.txt
          if-no-files-found: error
          compression-level: 0
