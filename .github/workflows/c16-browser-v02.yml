name: Build C16 Browser v0.2

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'c16-v02/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download full Chromium Android Desktop ARM64 APK
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, urllib.request
          api='https://api.github.com/repos/andrewginns/chromium-browser-snapshots-AndroidDesktop_arm64/releases/latest'
          req=urllib.request.Request(api, headers={'User-Agent':'C16-Browser-v02-Builder'})
          with urllib.request.urlopen(req, timeout=60) as r:
              data=json.load(r)
          apk=next((a for a in data.get('assets', []) if a.get('name')=='ChromePublic.apk'), None)
          if not apk:
              raise SystemExit('ChromePublic.apk not found')
          print('snapshot:', data.get('tag_name'))
          urllib.request.urlretrieve(apk['browser_download_url'], 'ChromePublic.apk')
          open('CHROMIUM_SNAPSHOT.txt','w').write(str(data.get('tag_name'))+'\n')
          PY
          ls -lh ChromePublic.apk
          sha256sum ChromePublic.apk

      - name: Download Apktool
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, urllib.request
          api='https://api.github.com/repos/iBotPeaches/Apktool/releases/latest'
          req=urllib.request.Request(api, headers={'User-Agent':'C16-Browser-v02-Builder'})
          with urllib.request.urlopen(req, timeout=60) as r:
              data=json.load(r)
          jar=next((a for a in data.get('assets', []) if a.get('name','').endswith('.jar') and 'apktool' in a.get('name','').lower()), None)
          if not jar:
              raise SystemExit('Apktool jar not found')
          urllib.request.urlretrieve(jar['browser_download_url'], 'apktool.jar')
          print('apktool:', jar['name'])
          PY
          java -jar apktool.jar --version

      - name: Decode Chromium including DEX smali
        shell: bash
        run: |
          set -euxo pipefail
          java -Xmx6g -jar apktool.jar d -f ChromePublic.apk -o c16-decoded
          du -sh c16-decoded
          find c16-decoded -maxdepth 1 -type d -name 'smali*' -print

      - name: Apply C16 branding and manifest compatibility patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path('c16-decoded')
          manifest=root/'AndroidManifest.xml'
          ANDROID='http://schemas.android.com/apk/res/android'
          A='{%s}' % ANDROID
          ET.register_namespace('android', ANDROID)
          tree=ET.parse(manifest)
          mr=tree.getroot()

          # Apktool stable framework cannot relink a few Android preview attributes used by this snapshot.
          stripped=[]
          for elem in mr.iter():
              for attr in ('zygotePreloadNativeLib','zygotePreloadNativeFunc','nativeService'):
                  key=A+attr
                  if key in elem.attrib:
                      stripped.append((elem.tag, attr, elem.attrib.get(key)))
                      elem.attrib.pop(key, None)
          print('preview attrs stripped:', len(stripped))

          app=mr.find('application')
          if app is not None:
              app.set(A+'label','C16 Browser')
              app.set(A+'resizeableActivity','true')

          activities=list(mr.findall('./application/activity'))
          aliases=list(mr.findall('./application/activity-alias'))
          launchers=0
          for node in activities+aliases:
              is_launcher=False
              for filt in node.findall('intent-filter'):
                  actions={x.get(A+'name') for x in filt.findall('action')}
                  cats={x.get(A+'name') for x in filt.findall('category')}
                  if 'android.intent.action.MAIN' in actions and 'android.intent.category.LAUNCHER' in cats:
                      is_launcher=True
              if not is_launcher:
                  continue
              launchers += 1
              node.set(A+'label','C16 Browser')
              target=node if node.tag=='activity' else None
              if node.tag=='activity-alias':
                  target_name=node.get(A+'targetActivity')
                  target=next((a for a in activities if a.get(A+'name')==target_name), None)
              if target is not None:
                  target.set(A+'screenOrientation','landscape')
                  target.set(A+'resizeableActivity','true')
          tree.write(manifest,encoding='utf-8',xml_declaration=True)
          print('launcher nodes patched:', launchers)

          # Visible app name resources.
          brand_names={'app_name','application_name','product_name','chrome_app_name','chrome_name','application_label','app_label','browser_app_name'}
          changed=0
          for p in root.glob('res/values*/strings.xml'):
              try:
                  t=ET.parse(p); rr=t.getroot(); dirty=False
                  for el in rr.findall('string'):
                      n=el.get('name','')
                      text=''.join(el.itertext()).strip()
                      if n in brand_names or text=='Chromium':
                          el.text='C16 Browser'; dirty=True; changed+=1
                  if dirty: t.write(p,encoding='utf-8',xml_declaration=True)
              except Exception as e:
                  print('skip strings', p, e)
          print('branding strings patched:', changed)
          PY

      - name: Inject emulator-safe Chromium GPU startup switches
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path('c16-decoded')
          files=list(root.glob('smali*/**/*.smali'))
          candidates=[]
          needle='Lorg/chromium/base/CommandLineInitUtil;->initCommandLine'
          for p in files:
              try:
                  txt=p.read_text(encoding='utf-8')
              except Exception:
                  continue
              if needle in txt:
                  score=0
                  s=str(p)
                  if 'SplitCompatApplication' in s: score+=100
                  if 'ChromeApplication' in s: score+=50
                  candidates.append((score,p,txt))
          if not candidates:
              raise SystemExit('Could not find Chromium command-line initialization smali')
          candidates.sort(key=lambda x:x[0], reverse=True)
          score,p,txt=candidates[0]
          print('injecting into:',p,'score=',score)

          pos=txt.find(needle)
          method_start=txt.rfind('\n.method ',0,pos)
          method_end=txt.find('\n.end method',pos)
          if method_start<0 or method_end<0:
              raise SystemExit('Could not locate method around initCommandLine')
          method=txt[method_start:method_end]
          lm=re.search(r'(?m)^\s*\.locals\s+(\d+)\s*$',method)
          if not lm:
              raise SystemExit('Target method does not use .locals; refusing unsafe injection')
          old_locals=int(lm.group(1))
          obj=f'v{old_locals}'
          arg=f'v{old_locals+1}'
          method=method[:lm.start()] + re.sub(r'\.locals\s+\d+', f'.locals {old_locals+2}', lm.group(0)) + method[lm.end():]

          call_pos=method.find(needle)
          line_end=method.find('\n',call_pos)
          if line_end<0: line_end=len(method)
          flags=['disable-gpu','disable-gpu-compositing','disable-gpu-early-init','disable-vulkan','disable-gpu-watchdog']
          inject=['', '    # C16 Browser v0.2: emulator/vehicle GPU compatibility switches',
                  '    invoke-static {}, Lorg/chromium/base/CommandLine;->getInstance()Lorg/chromium/base/CommandLine;',
                  f'    move-result-object {obj}']
          for flag in flags:
              inject += [f'    const-string {arg}, "{flag}"',
                         f'    invoke-virtual {{{obj}, {arg}}}, Lorg/chromium/base/CommandLine;->appendSwitch(Ljava/lang/String;)V']
          inject_text='\n'+'\n'.join(inject)+'\n'
          method=method[:line_end+1]+inject_text+method[line_end+1:]
          txt=txt[:method_start]+method+txt[method_end:]
          p.write_text(txt,encoding='utf-8')
          print('injected flags:', ','.join(flags))
          print('locals:',old_locals,'->',old_locals+2)

          # Verify the injected strings exist in the final smali tree.
          verify=p.read_text(encoding='utf-8')
          for f in flags:
              if f'"{f}"' not in verify:
                  raise SystemExit('missing injected flag '+f)
          Path('C16_BUILD_INFO.txt').write_text(
              'C16 Browser Alpha v0.2\n'
              'Full Chromium Android Desktop ARM64\n'
              'No Android WebView wrapper\n'
              'Landscape launcher\n'
              'GPU crash compatibility switches injected into Chromium startup\n'
              'Flags: '+', '.join(flags)+'\n',encoding='utf-8')
          PY

      - name: Rebuild Chromium v0.2 APK
        shell: bash
        run: |
          set -euxo pipefail
          java -Xmx6g -jar apktool.jar b c16-decoded -o C16Browser-v02-unsigned.apk
          ls -lh C16Browser-v02-unsigned.apk

      - name: Align sign and verify APK
        shell: bash
        run: |
          set -euxo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          keytool -genkeypair -v -keystore c16-v02.jks -storepass c16browser -keypass c16browser -alias c16 -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=C16 Browser v0.2, OU=Car Browser, O=C16, L=Kunming, ST=Yunnan, C=CN'
          "$BUILD_TOOLS/zipalign" -f -p 4 C16Browser-v02-unsigned.apk C16Browser-v02-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks c16-v02.jks --ks-key-alias c16 --ks-pass pass:c16browser --key-pass pass:c16browser --out C16Browser-Alpha-v0.2.apk C16Browser-v02-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs C16Browser-Alpha-v0.2.apk | tee SIGNATURE_VERIFY.txt
          sha256sum C16Browser-Alpha-v0.2.apk | tee C16Browser-Alpha-v0.2.apk.sha256
          ls -lh C16Browser-Alpha-v0.2.apk

      - name: Upload signed v0.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: C16Browser-Alpha-v0.2-APK
          path: |
            C16Browser-Alpha-v0.2.apk
            C16Browser-Alpha-v0.2.apk.sha256
            CHROMIUM_SNAPSHOT.txt
            C16_BUILD_INFO.txt
            SIGNATURE_VERIFY.txt
          if-no-files-found: error
          compression-level: 0
