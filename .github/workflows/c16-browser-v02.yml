name: Build C16 Browser v0.2 Compat

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'c16-v02/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Chromium snapshot 1676249
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import urllib.request
          url='https://github.com/andrewginns/chromium-browser-snapshots-AndroidDesktop_arm64/releases/download/1676249/ChromePublic.apk'
          urllib.request.urlretrieve(url, 'ChromePublic.apk')
          open('CHROMIUM_SNAPSHOT.txt','w').write('1676249\n')
          PY
          ls -lh ChromePublic.apk
          sha256sum ChromePublic.apk

      - name: Download Apktool
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, urllib.request
          req=urllib.request.Request('https://api.github.com/repos/iBotPeaches/Apktool/releases/latest',headers={'User-Agent':'C16-v02-builder'})
          with urllib.request.urlopen(req,timeout=60) as r: data=json.load(r)
          jar=next(a for a in data['assets'] if a['name'].endswith('.jar') and 'apktool' in a['name'].lower())
          urllib.request.urlretrieve(jar['browser_download_url'],'apktool.jar')
          print(jar['name'])
          PY
          java -jar apktool.jar --version

      - name: Decode resources and preserve Chromium code
        shell: bash
        run: |
          set -euxo pipefail
          java -Xmx5g -jar apktool.jar d -f -s ChromePublic.apk -o decoded

      - name: Apply C16 compatibility patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path('decoded')
          manifest=root/'AndroidManifest.xml'
          ANDROID='http://schemas.android.com/apk/res/android'; A='{%s}'%ANDROID
          ET.register_namespace('android',ANDROID)
          t=ET.parse(manifest); mr=t.getroot()
          for e in mr.iter():
              for a in ('zygotePreloadNativeLib','zygotePreloadNativeFunc','nativeService'):
                  e.attrib.pop(A+a,None)
          app=mr.find('application')
          if app is not None:
              app.set(A+'label','C16 Browser')
              app.set(A+'resizeableActivity','true')
          activities=list(mr.findall('./application/activity'))
          for node in activities+list(mr.findall('./application/activity-alias')):
              launcher=False
              for f in node.findall('intent-filter'):
                  acts={x.get(A+'name') for x in f.findall('action')}
                  cats={x.get(A+'name') for x in f.findall('category')}
                  launcher |= 'android.intent.action.MAIN' in acts and 'android.intent.category.LAUNCHER' in cats
              if not launcher: continue
              node.set(A+'label','C16 Browser')
              target=node if node.tag=='activity' else next((a for a in activities if a.get(A+'name')==node.get(A+'targetActivity')),None)
              if target is not None:
                  target.set(A+'screenOrientation','landscape')
                  target.set(A+'resizeableActivity','true')
          t.write(manifest,encoding='utf-8',xml_declaration=True)
          Path('C16_BUILD_INFO.txt').write_text('C16 Browser Alpha v0.2 Compat\nFull Chromium Android Desktop ARM64\nNo Android WebView wrapper\nChromium snapshot: 1676249\nLandscape C16 launcher\n',encoding='utf-8')
          PY

      - name: Rebuild Chromium APK
        shell: bash
        run: |
          set -euxo pipefail
          java -Xmx5g -jar apktool.jar b decoded -o unsigned.apk

      - name: Align sign and verify
        shell: bash
        run: |
          set -euxo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          keytool -genkeypair -v -keystore c16.jks -storepass c16browser -keypass c16browser -alias c16 -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=C16 Browser v0.2, OU=Car Browser, O=C16, L=Kunming, ST=Yunnan, C=CN'
          "$BT/zipalign" -f -p 4 unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks c16.jks --ks-key-alias c16 --ks-pass pass:c16browser --key-pass pass:c16browser --out C16Browser-Alpha-v0.2.apk aligned.apk
          "$BT/apksigner" verify --verbose --print-certs C16Browser-Alpha-v0.2.apk | tee SIGNATURE_VERIFY.txt
          sha256sum C16Browser-Alpha-v0.2.apk | tee C16Browser-Alpha-v0.2.apk.sha256
          ls -lh C16Browser-Alpha-v0.2.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: C16Browser-Alpha-v0.2-APK
          path: |
            C16Browser-Alpha-v0.2.apk
            C16Browser-Alpha-v0.2.apk.sha256
            CHROMIUM_SNAPSHOT.txt
            C16_BUILD_INFO.txt
            SIGNATURE_VERIFY.txt
          compression-level: 0
          if-no-files-found: error
