name: Publish C16 Browser APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'c16/publish-trigger.txt'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download successful C16 Browser build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/9946204252/zip > artifact.zip
          unzip -o artifact.zip
          ls -lh
          test -f C16Browser-Alpha.apk
          sha256sum C16Browser-Alpha.apk
          cat C16Browser-Alpha.apk.sha256

      - name: Verify APK signature
        run: |
          set -euxo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs C16Browser-Alpha.apk

      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="c16-browser-alpha-20260905"
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --yes || true
          gh release create "$TAG" \
            C16Browser-Alpha.apk \
            C16Browser-Alpha.apk.sha256 \
            CHROMIUM_SNAPSHOT.txt \
            C16_BUILD_INFO.txt \
            --title "C16 Browser Alpha - Full Chromium ARM64" \
            --notes "C16 Browser Alpha for Leapmotor C16. Full Chromium Android Desktop ARM64 base; no Android WebView wrapper. Landscape/branding compatibility build for C16 testing."
